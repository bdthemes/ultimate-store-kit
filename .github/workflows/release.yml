name: Publish Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release-free:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Archive release
        uses: thedoctor0/zip-release@0.7.1
        with:
          type: zip
          filename: ultimate-store-kit.zip
          exclusions: "/*node_modules/* /*src/* /*gruntfile.js /*package.json /*package-lock.json /*sync.ffs_db /*.idea/* /*.DS_Store/* /*.gitignore /*.github/* /*.git/* /*LICENSE /*.eslintrc /*.gitattributes /*.prettierrc"
      - name: Create ultimate-store-kit directory and move files
              run: |
                  mkdir -p ultimate-store-kit &&
                  find . -maxdepth 1 -not -name 'ultimate-store-kit' -exec mv {} ultimate-store-kit \;
      - name: display release
        run: ls -a

      - name: Create Release
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "ultimate-store-kit.zip"
          token: ${{ secrets.TOKEN }}
          removeArtifacts: true
          allowUpdates: true
          makeLatest: true
          tag: ${{ github.ref_name }}
